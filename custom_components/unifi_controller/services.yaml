        object: {}
create_vouchers:
  fields:
    config_entry_id: *id001
    name:
      required: true
      example: Gäste Wochenende
      selector:
        text: {}
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    minutes:
      default: 1440
      selector:
        number:
          min: 1
          max: 1000000
          unit_of_measurement: min
          mode: box
    guest_limit:
      selector:
        number:
          min: 1
          max: 100
          mode: box
    data_mb:
      selector:
        number:
          min: 1
          max: 1048576
          unit_of_measurement: MB
          mode: box
    down_kbps:
      selector:
        number:
          min: 2
          max: 100000
          unit_of_measurement: kbit/s
          mode: box
    up_kbps:
      selector:
        number:
          min: 2
          max: 100000
          unit_of_measurement: kbit/s
          mode: box
