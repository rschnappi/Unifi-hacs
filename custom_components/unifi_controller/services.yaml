api_request:
  fields:
    config_entry_id: &id001
      selector:
        config_entry:
          integration: unifi_controller
    method:
      required: true
      default: GET
      selector:
        select:
          options:
          - GET
          - POST
          - PUT
          - DELETE
    path:
      required: true
      example: stat/sysinfo
      selector:
        text: {}
    payload:
      selector:
        object: {}
    include_secrets:
      selector:
        boolean: {}
get_objects:
  fields:
    config_entry_id: *id001
    resource: &id002
      required: true
      selector:
        select:
          options:
          - networks
          - wlans
          - firewall_policies
          - firewall_zones
          - firewall_groups
          - trafficrules
          - trafficroutes
          - portforwards
          - routes
          - dns_records
          - port_profiles
          - usergroups
          - qos_rules
          - settings
          - users
    filter:
      selector:
        text: {}
    refresh:
      selector:
        boolean: {}
    include_secrets:
      selector:
        boolean: {}
update_object:
  fields:
    config_entry_id: *id001
    resource: *id002
    object: &id003
      required: true
      example: Sperre Benjamin Internet
      selector:
        text: {}
    changes:
      required: true
      example: '{"enabled": true}'
      selector:
        object: {}
create_object:
  fields:
    config_entry_id: *id001
    resource: *id002
    data:
      required: true
      selector:
        object: {}
delete_object:
  fields:
    config_entry_id: *id001
    resource: *id002
    object: *id003
set_enabled:
  fields:
    config_entry_id: *id001
    resource: *id002
    object: *id003
    enabled:
      required: true
      selector:
        boolean: {}
refresh:
  fields:
    config_entry_id: *id001
get_logs:
  fields:
    config_entry_id: *id001
    hours:
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: h
    limit:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    category:
      example: SECURITY
      selector:
        text: {}
    filter:
      selector:
        text: {}
ban_ip:
  fields:
    config_entry_id: *id001
    ip: &id004
      required: true
      example: 203.0.113.5
      selector:
        text: {}
    minutes:
      selector:
        number:
          min: 1
          max: 525600
          unit_of_measurement: min
          mode: box
    reason:
      selector:
        text: {}
unban_ip:
  fields:
    config_entry_id: *id001
    ip: *id004
get_bans:
  fields:
    config_entry_id: *id001
regenerate_vpn_key:
  fields:
    config_entry_id: *id001
    vpn:
      required: true
      example: One-Click VPN
      selector:
        text: {}
regenerate_wlan_password:
  fields:
    config_entry_id: *id001
    wlan:
      required: true
      example: guest
      selector:
        text: {}
    length:
      selector:
        number:
          min: 12
          max: 63
          mode: box
    notify:
      selector:
        boolean: {}
set_region_blocking:
  fields:
    config_entry_id: *id001
    enabled:
      selector:
        boolean: {}
    countries:
      example: '["AT", "DE", "CH", "SI", "HR"]'
      selector:
        object: {}
    add:
      example: '["IT"]'
      selector:
        object: {}
    remove:
      selector:
        object: {}
    exceptions:
      example: '["160.79.104.0/21"]'
      selector:
        object: {}
    zones:
      selector:
        object: {}
    wireguard:
      selector:
        boolean: {}
block_client:
  fields:
    config_entry_id: *id001
    mac: &id005
      required: true
      example: aa:bb:cc:dd:ee:ff
      selector:
        text: {}
unblock_client:
  fields:
    config_entry_id: *id001
    mac: *id005
reconnect_client:
  fields:
    config_entry_id: *id001
    mac: *id005
forget_client:
  fields:
    config_entry_id: *id001
    mac: *id005
unauthorize_guest:
  fields:
    config_entry_id: *id001
    mac: *id005
restart_device:
  fields:
    config_entry_id: *id001
    mac: *id005
authorize_guest:
  fields:
    config_entry_id: *id001
    mac: *id005
    minutes:
      selector:
        number:
          min: 1
          max: 525600
          unit_of_measurement: min
power_cycle_port:
  fields:
    config_entry_id: *id001
    mac: *id005
    port_idx:
      required: true
      selector:
        number:
          min: 1
          max: 52
          mode: box
set_wlan:
  fields:
    config_entry_id: *id001
    wlan:
      required: true
      example: guest
      selector:
        text: {}
    enabled:
      selector:
        boolean: {}
    passphrase:
      selector:
        text:
          type: password
get_flows:
  fields:
    config_entry_id: *id001
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    client:
      example: Google Home Mini
      selector:
        text: {}
    action:
      selector:
        select:
          options:
          - blocked
          - allowed
          - all
    policy:
      example: IoT -> Gateway
      selector:
        text: {}
    destination:
      selector:
        text: {}
    limit:
      selector:
        number:
          min: 1
          max: 500
          mode: box
create_vpn_client:
  fields:
    config_entry_id: *id001
    name:
      required: true
      example: Handy Sophie
      selector:
        text: {}
    vpn:
      example: One-Click VPN
      selector:
        text: {}
    allowed_ips:
      example: 0.0.0.0/0, ::/0
      selector:
        text: {}
    dns:
      selector:
        text: {}
    endpoint:
      example: vpn.example.com
      selector:
        text: {}
    notify:
      selector:
        boolean: {}
delete_vpn_client:
  fields:
    config_entry_id: *id001
    name:
      required: true
      selector:
        text: {}
    vpn:
      selector:
        text: {}
run_speedtest:
  fields:
    config_entry_id: *id001
create_backup:
  fields:
    config_entry_id: *id001
set_app_block:
  fields:
    config_entry_id: *id001
    network:
      required: true
      example: Benjamin
      selector:
        text: {}
    app:
      required: true
      selector:
        select:
          options:
          - YouTube
          - TikTok
          - Instagram
          - Snapchat
          - WhatsApp
          - Roblox
          - Fortnite
          - Minecraft
          - Twitch
          - Discord
          - Netflix
    blocked:
      required: true
      selector:
        boolean: {}
add_kid:
  fields:
    config_entry_id: *id001
    name:
      required: true
      example: Lena
      selector:
        text: {}
    network:
      example: Lena
      selector:
        text: {}
    unlock:
      selector:
        time: {}
    lock_school:
      selector:
        time: {}
    lock_weekend:
      selector:
        time: {}
    schedule:
      selector:
        boolean: {}
    free_calendars:
      selector:
        entity:
          domain: calendar
          multiple: true
    free_filter_calendars:
      selector:
        entity:
          domain: calendar
          multiple: true
    free_filter:
      example: Benjamin
      selector:
        text: {}
kid_free_days:
  fields:
    config_entry_id: *id001
    kid:
      required: true
      example: Sophie
      selector:
        text: {}
    free_calendars:
      selector:
        entity:
          domain: calendar
          multiple: true
    free_filter_calendars:
      selector:
        entity:
          domain: calendar
          multiple: true
    free_filter:
      example: Sophie
      selector:
        text: {}
assign_device:
  fields:
    config_entry_id: *id001
    mac:
      required: true
      example: aa:bb:cc:dd:ee:ff
      selector:
        text: {}
    kid:
      example: Benjamin
      selector:
        text: {}
kid_bonus:
  fields:
    config_entry_id: *id001
    kid:
      required: true
      example: Sophie
      selector:
        text: {}
    minutes:
      selector:
        number:
          min: 5
          max: 480
          unit_of_measurement: min
kid_internet:
  fields:
    config_entry_id: *id001
    kid:
      required: true
      example: Florian
      selector:
        text: {}
    online:
      required: true
      selector:
        boolean: {}
notify:
  fields:
    config_entry_id: *id001
    category:
      required: true
      selector:
        select:
          options:
          - new_device
          - internet
          - security
          - updates
          - kids
          - presence
    title:
      required: true
      selector:
        text: {}
    message:
      required: true
      selector:
        text:
          multiline: true
    data:
      selector:
        object: {}
