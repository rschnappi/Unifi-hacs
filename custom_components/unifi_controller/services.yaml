    mac: *id005
authorize_guest:
  fields:
    config_entry_id: *id001
    mac: *id005
    minutes:
      selector:
        number:
          min: 1
          max: 525600
          unit_of_measurement: min
    data_limit_mb:
      selector:
        number:
          min: 1
          max: 1048576
          unit_of_measurement: MB
          mode: box
    download_kbps:
      selector:
        number:
          min: 2
          max: 10000000
          unit_of_measurement: kbit/s
          mode: box
    upload_kbps:
      selector:
        number:
          min: 2
          max: 10000000
          unit_of_measurement: kbit/s
          mode: box
power_cycle_port:
  fields:
    config_entry_id: *id001
    mac: *id005
    port_idx:
      required: true
      selector:
        number:
          min: 1
          max: 52
          mode: box
set_wlan:
  fields:
    config_entry_id: *id001
    wlan:
      required: true
      example: guest
      selector:
        text: {}
    enabled:
      selector:
        boolean: {}
    hidden:
      selector:
        boolean: {}
    client_isolation:
      selector:
        boolean: {}
    passphrase:
      selector:
        text:
          type: password
get_flows:
  fields:
    config_entry_id: *id001
    minutes:
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    client:
      example: Google Home Mini
      selector:
        text: {}
    action:
      selector:
        select:
          options:
          - blocked
          - allowed
          - all
    policy:
      example: IoT -> Gateway
      selector:
        text: {}
    destination:
      selector:
        text: {}
    limit:
      selector:
        number:
          min: 1
          max: 500
          mode: box
