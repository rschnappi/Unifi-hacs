    mac: *id005
set_firewall_logging:
  fields:
    config_entry_id: *id001
    policy:
      required: true
      example: Infra -> MCL-Netze blocken
      selector:
        text: {}
    logging:
      selector:
        boolean: {}
    report_flow:
      selector:
        boolean: {}
set_acl_rule:
  fields:
    config_entry_id: *id001
    rule:
      required: true
      selector:
        text: {}
    enabled:
      required: true
      selector:
        boolean: {}
set_dns_record:
  fields:
    config_entry_id: *id001
    domain:
      required: true
      example: nas.lan
      selector:
        text: {}
    value:
      required: true
      example: 192.168.99.10
      selector:
        text: {}
    type:
      default: A
      selector:
        select:
          options:
          - A
          - AAAA
          - CNAME
          - MX
          - TXT
          - SRV
          - FORWARD
    ttl:
      default: 0
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    enabled:
      default: true
      selector:
        boolean: {}
    priority:
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    weight:
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    port:
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    service:
      example: _sip
      selector:
        text: {}
    protocol:
      example: _tcp
      selector:
        text: {}
delete_dns_record:
  fields:
    config_entry_id: *id001
    domain:
      required: true
      selector:
        text: {}
    type:
      selector:
        select:
          options:
          - A
          - AAAA
          - CNAME
          - MX
          - TXT
          - SRV
          - FORWARD
update_devices:
  fields:
    config_entry_id: *id001
    devices:
      example: "Access Point Benjamin"
      selector:
        text:
          multiple: true
    include_manual:
      default: false
      selector:
        boolean: {}
    dry_run:
      default: false
      selector:
        boolean: {}
    cancel:
      default: false
      selector:
        boolean: {}
set_network:
  fields:
    config_entry_id: *id001
    network:
      required: true
      example: Florian
      selector:
        text: {}
    name:
      selector:
        text: {}
    enabled:
      selector:
        boolean: {}
    vlan:
      selector:
        number:
          min: 1
          max: 4009
          mode: box
    internet_access:
      selector:
        boolean: {}
    isolation:
      selector:
        boolean: {}
    mdns:
      selector:
        boolean: {}
    cellular_backup:
      selector:
        boolean: {}
    gateway_ip:
      example: 192.168.43.1
      selector:
        text: {}
    prefix_length:
      selector:
        number:
          min: 8
          max: 30
          mode: box
    auto_scale:
      selector:
        boolean: {}
    dhcp_start:
      example: 192.168.43.6
      selector:
        text: {}
    dhcp_stop:
      example: 192.168.43.254
      selector:
        text: {}
    lease_time:
      selector:
        number:
          min: 60
          max: 31536000
          unit_of_measurement: s
          mode: box
    domain_name:
      selector:
        text: {}
    ping_conflict_detection:
      selector:
        boolean: {}
    confirm_subnet_change:
      default: false
      selector:
        boolean: {}
