# Einmalig: alte Releases/Tags mit Firmenbezug entfernen (danach wird die Datei wieder gelöscht)
name: Alte Releases entfernen
on:
  push:
    branches: ["claude/cleanup-releases"]
    paths: [".github/workflows/cleanup-releases.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          for t in v0.12.0 v0.12.1 v0.13.0 v0.13.1 v0.14.0 v0.15.0 v0.16.0 v0.17.0 v0.17.1 v0.17.2 v0.18.0 v0.19.0 v0.19.1 v0.20.0 v0.20.1 v0.21.0 v0.21.1; do
            gh release delete "$t" -R "$REPO" --yes --cleanup-tag && echo "gelöscht: $t" || echo "fehlt: $t"
          done
