# Einmalig: Tags auf die bereinigte Historie umsetzen (danach wird die Datei wieder gelöscht)
name: Tags umsetzen
on:
  push:
    branches: ["claude/retag"]
    paths: [".github/workflows/retag.yml"]
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r t sha; do
            [ -z "$t" ] && continue
            git tag -f -a "$t" "$sha" -m "$t"
            git push -f origin "refs/tags/$t" && echo "umgesetzt: $t -> $sha"
          done <<'MAP'
