name: Release
on:
  push:
    branches: [main]
    paths:
      - custom_components/unifi_controller/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version aus manifest.json
        id: v
        run: echo "version=$(jq -r .version custom_components/unifi_controller/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Release anlegen, falls neu
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG existiert bereits – nichts zu tun"; exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
